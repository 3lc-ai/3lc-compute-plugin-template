<!--
  The plugin's UI: one self-contained HTML+CSS+JS fragment, served at
  GET /api/plugins/template/ui and mounted into the Hub by the frontend.

  Three rules make a fragment a good citizen (python -m tlc_plugin_sdk.lint src/ checks them):
  1. Reach the host ONLY through window.PLUGIN_API (typed via the repo-root
     jsconfig.json — hover it in your editor).
  2. Use the Hub's classes for controls (.btn, .form-control, .form-select, .form-label)
     and the theme tokens for colour (var(--text), var(--bg-card), ...), so the fragment
     matches the active theme, light and dark — never a hardcoded colour or a button style
     of your own.
  3. Scope every rule of your own under a class named after the plugin (.template-…),
     so nothing leaks into the Hub page.
-->
<div class="template-plugin">
  <style>
    .template-plugin { color: var(--text); padding: 20px; max-width: 640px; }
    .template-plugin h1 { margin: 0 0 4px; font-size: 20px; }
    .template-plugin p { color: var(--text-muted); font-size: 12px; margin: 0 0 16px; }
    .template-plugin pre { background: var(--code-bg); color: var(--code-fg); border-radius: var(--radius-sm, 4px); padding: 10px; overflow: auto; font-size: 12px; margin-top: 8px; }
  </style>

  <h1>Template plugin</h1>
  <p>Replace everything you see with your own UI.</p>

  <button id="template-go" class="btn btn-sm btn-primary">Call compute()</button>
  <pre id="template-out">—</pre>

  <script>
  (function () {
    var API = window.PLUGIN_API;
    var EL = document.currentScript.closest('.template-plugin');
    var base = API.getConfig('compute_service_url');

    EL.querySelector('#template-go').onclick = function () {
      API.authFetch(base + '/api/plugins/template/compute?greeting=hi')
        .then(function (r) { return r.json(); })
        .then(function (j) { EL.querySelector('#template-out').textContent = JSON.stringify(j, null, 2); });
    };
  })();
  </script>
</div>
