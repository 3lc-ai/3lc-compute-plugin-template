<!--
  The plugin's UI: one self-contained HTML+CSS+JS fragment, served at
  GET /api/plugins/template/ui. The Hub shows it in a sandboxed frame served by the
  compute service, so it cannot see the Hub's page, its globals or the sign-in.

  Three rules make a fragment a good citizen:
  1. Reach the host ONLY through window.PLUGIN_API (typed via the repo-root
     jsconfig.json â€” hover it in your editor): compute.request for your routes,
     nav.go() to move the Hub. No TlcApi, window.top or location.href.
  2. Need more than your own routes? Declare it under [ui] capabilities in plugin.toml.
  3. Style with the house CSS variables (var(--text), var(--bg-card), ...) so the
     fragment matches the active theme, light and dark.
-->
<div class="template-plugin">
  <style>
    .template-plugin { color: var(--text); padding: 20px; max-width: 640px; }
    .template-plugin h1 { margin: 0 0 4px; font-size: 20px; }
    .template-plugin p { color: var(--text-muted); font-size: 12px; margin: 0 0 16px; }
    .template-plugin button { font: inherit; font-size: 12px; padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm, 4px); background: var(--bg); color: var(--text); cursor: pointer; }
    .template-plugin button:hover { background: var(--accent-light); border-color: var(--accent); }
    .template-plugin pre { background: var(--code-bg); color: var(--code-fg); border-radius: var(--radius-sm, 4px); padding: 10px; overflow: auto; font-size: 12px; }
  </style>

  <h1>Template plugin</h1>
  <p>Replace everything you see with your own UI.</p>

  <button id="template-go">Call compute()</button>
  <pre id="template-out">â€”</pre>

  <script>
  (function () {
    var API = window.PLUGIN_API;
    var EL = document.currentScript.closest('.template-plugin');
    if (!API || !API.compute || typeof API.compute.request !== 'function' || !API.lifecycle) {
      EL.querySelector('#template-out').textContent = 'Update your Compute service to use this plugin’s browser runtime.';
      EL.querySelector('#template-go').disabled = true;
      return;
    }
    var button = EL.querySelector('#template-go');
    var output = EL.querySelector('#template-out');
    var disposed = false;
    API.lifecycle.onDispose(function () { disposed = true; button.onclick = null; });
    button.onclick = async function () {
      button.disabled = true;
      output.textContent = 'Working…';
      try {
        var response = await API.compute.request('/api/plugins/template/compute?greeting=hi');
        var result = await response.json();
        if (!disposed) output.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        if (!disposed) output.textContent = error.message || 'The request failed.';
      } finally {
        if (!disposed) button.disabled = false;
      }
    };
  })();
  </script>
</div>
