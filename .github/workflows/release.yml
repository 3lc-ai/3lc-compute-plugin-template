name: Release

# A pushed vX.Y.Z tag runs CI, checks that the tag is the project's version, builds the wheel and
# sdist, and publishes them to PyPI through Trusted Publishing. The tests already check that
# pyproject.toml, plugin.toml and catalog.json carry the same version. Running the workflow by
# hand is a dry run: the same checks and build, nothing published.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"

      - name: The tag is the version in pyproject.toml
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Never in the template repo itself: a plugin made from it is another repository and publishes.
    if: github.event_name == 'push' && github.repository != '3lc-ai/3lc-compute-plugin-template'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
