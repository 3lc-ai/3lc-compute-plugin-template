# Dependencies for the VENV plugin's own environment.
#
# This is the whole point of the venv tier: declare your dependencies here and they
# are installed into THIS plugin's venv, isolated from the compute-service. They may
# pin versions that conflict with the service's — that's fine, they don't share an env.
#
# The compute-service builds the venv from this file (uv). Until automatic provisioning
# lands you can build it by hand — see the README ("Running the venv example").

[project]
name = "template-venv-plugin"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # The import-light plugin SDK — NOT the full server stack:
    "3lc-compute",
    # Your own dependencies go here. Examples (uncomment as needed):
    # "pandas>=2.0",
    # "pillow>=10",
    # "torch",                       # heavy/native deps are exactly why this tier exists
]

# Machine-readable sources for deps that aren't on PyPI (uv reads these), e.g.:
# [[tool.uv.index]]
# name = "pytorch-cu126"
# url = "https://download.pytorch.org/whl/cu126"
# explicit = true
#
# [tool.uv.sources]
# torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
