# 3lc-compute-plugin-template — the starting point for a 3LC compute-service plugin: the
# bare-bones skeleton (src/tlc_plugin_template) you instantiate via GitHub's "Use this
# template" and rename. For a runnable tour of the full contract, see the example plugin:
# https://github.com/3lc-ai/3lc-compute-plugin-example
#
# Isolation contract: this distribution is NEVER installed into the host venv. The host discovers
# the plugin from its bundled `plugin.toml` (read WITHOUT importing) and provisions it into its
# OWN managed venv — via a folder Source pointed at `src/` (dev) or an install from the catalog
# (git/index). A plugin's deps live in its extra below and land only in that plugin's venv.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3lc-compute-plugin-template"
version = "0.1.0"
description = "Template plugin for the 3LC compute service (venv-isolated)."
# The SDK's own range. The host builds the plugin's venv with its own interpreter (Python 3.11 or
# newer on Compute 1.2); the ceiling is there because the 3lc core publishes no 3.15 wheels yet.
requires-python = ">=3.10,<3.15"
# Apache-2.0, matching 3lc-compute-plugin-sdk. Full text in ./LICENSE.
license = { text = "Apache-2.0" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
# Base = the SDK floor ONLY. The skeleton needs no more; your real plugin's deps go in its
# extra below, never in the base. The SDK brings the `tlc` data plane (`3lc[pandas]`) and the
# `tlc_plugin_sdk.shared.*` helpers with it — no separate `3lc` dep is needed. Everything resolves
# from public PyPI.
#
# The SDK version is the plugin contract, compared on MAJOR.MINOR: the 0.6 line is what Compute
# 1.2 implements, so this pin and `min_service_version` in plugin.toml say the same thing. Raise
# the floor when you use something a later release added; move the ceiling with the fleet.
dependencies = [
    "3lc-compute-plugin-sdk>=0.6.1,<0.7.0",
]

# Per-plugin extras — installed ONLY into that plugin's provisioned venv. Provisioning opts into
# the extra named by the plugin manifest's runtime.provision_extra. The skeleton is
# deliberately dependency-free (installs stay snappy); this is where your torch/pandas/… go.
[project.optional-dependencies]
template = []

# Every plugin advertises itself here; the host iterates this group to discover them all.
# Value = the import package; its bundled plugin.toml drives id/ui/runtime (and the extra).
[project.entry-points."tlc_compute.plugins"]
template = "tlc_plugin_template"

# Tests run the plugin through the SDK's harness and lint (tests/): `uv sync --extra template`
# then `uv run pytest`. Never a runtime dependency of the plugin.
[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/tlc_plugin_template",
]

# Both `3lc` and `3lc-compute-plugin-sdk` resolve from public PyPI — no custom indexes. For local
# dev against a sibling SDK checkout, add an UNCOMMITTED [tool.uv.sources] override (a committed
# relative `path = ...` source breaks remote consumers — uv reads it as a subdirectory of this
# repo):
#   [tool.uv.sources]
#   3lc-compute-plugin-sdk = { path = "../3lc-compute-plugin-sdk", editable = true }

# Ruff config mirrors 3lc-compute-plugin-sdk for a consistent house style. CI runs ruff
# standalone (uvx) — linting must not require resolving any dependency stack.
[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["A", "C4", "E", "EM", "F", "I", "N", "PIE", "RUF", "SIM", "UP", "W"]
ignore = ["N806", "N818", "SIM105", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
preview = true
docstring-code-format = true
